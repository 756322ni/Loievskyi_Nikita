<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loievskyi Nikita</title>
</head>
<body>
    
<div style="color:navy;font-size:50px;"> 
<script language="JavaScript"> 
var a=parseFloat(prompt("a=","")); 
var b=parseFloat(prompt("b=","")); 
function suma_loi(a, b) { 
return a + b; 
} 
function odejmowanie_loi(a, b){
return a - b;
}
function mnozenie_loi(a, b){
return a * b;
} 
function od_kwadratu_loi(a, b){
document.write(a+"^2 ="+a*a+"<br>");
document.write(b+"^2 ="+b*b);
}
document.write("suma="+suma_loi(a,b)+"<br>"); 
document.write("odejmowanie="+odejmowanie_loi(a,b)+"<br>");
document.write("mnożenie="+mnozenie_loi(a,b)+"<br>");
od_kwadratu_loi(a,b);
</script>
</div>
</body>
</html>
