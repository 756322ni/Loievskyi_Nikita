<!DOCTYPE html>
<html> 
 <head> 
  <meta charset="UTF-8"> 
  <title>Loievskyi Nikita</title>
 </head> 
<body> 
 Tu będą wyswietlać się podane liczby <br>
x1= <input size="5px" type="text" id="x1" placeholder="podana liczba" readonly>
&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
x2= <input size="5px" type="text" id="x2" placeholder="podana liczba" readonly><br>

x1= <input size="5px" type="text" id="x1_st" placeholder="podana liczba" readonly>
&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;
x1(w radianach)= <input size="5px" type="text" id="x1_rad" placeholder="podana liczba" readonly><br><br><br>

  y1=    <input size="5px" id="y1" readonly><br>
  y2=     <input size="5px" id="y2" readonly><br>
  y3=     <input size="5px" id="y3" readonly>

<script type="text/javascript"> 
var x1_loi = parseFloat(prompt("Podaj x1:"));
var x2_loi = parseFloat(prompt("Podaj x2:"));
document.getElementById('x1').value =x1_loi;
document.getElementById('x2').value =x2_loi;
document.getElementById('x1_st').value =x1_loi;
var x1_loi_rad=x1_loi*Math.PI/180;
document.getElementById('x1_rad').value =x1_loi_rad.toFixed(2);

 var odp1= 3*Math.pow(x1_loi,6/8);

 var odp2= (2*Math.cos(x1_loi_rad))+(3*Math.sin(x1_loi_rad));

 var odp3= Math.pow((Math.pow(x1_loi,5)+2*Math.pow(x2_loi,4)*Math.abs(x1_loi-x2_loi)),1/3);

 document.getElementById('y1').value =odp1.toFixed(2);
 document.getElementById('y2').value =odp2.toFixed(2);
 document.getElementById('y3').value =odp3.toFixed(2);
 </script>

</body> 
</html>
