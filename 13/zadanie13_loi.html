<!DOCTYPE html>
<html lang="pl-PL">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loievskyi Nikita</title>
</head>
<body>
    <div style="color: red; font-size: 100px;">
        <script language="JavaScript">
            var liczba1=prompt("Podaj mianownik m=","");
            var n_loi=parseFloat(liczba1);
            document.write("1/"+n_loi+"=");
            document.write("1/"+(1+n_loi)+"+");
            document.write("1/"+(n_loi*(1+n_loi))+"<br>");
        </script>
    </div>
</body>
</html>
