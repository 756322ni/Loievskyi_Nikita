<!DOCTYPE html>
<html lang="pl-PL">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loievskyi Nikita</title>
</head>
<body>
    <div style="color: red; font-size: 20px;">
        <script language="JavaScript">
            var A_loi=prompt("Podaj A m=","");
            var B_loi=prompt("Podaj B m=","");
            var c=A_loi*A_loi*A_loi;
            var d=3*A_loi*A_loi*B_loi;
            var e=3*A_loi*B_loi*B_loi;
            var f=B_loi*B_loi*B_loi;
            var odp=c+d+e+f;
            document.write("(A+B)^3 = "+A_loi+"^3 + 3*(("+A_loi+")^2)*("+B_loi+") + 3*("+A_loi+")*(("+B_loi+")^2) + "+B_loi+"^3 = "+c+"+"+d+"+"+e+"+"+f+" = "+odp+"");
            
        </script>
    </div>
</body>
</html>
